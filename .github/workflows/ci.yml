name: desk checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read

jobs:
  desk:
    name: desk scripts (python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.9', '3.12', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m compileall -q scripts
      - run: python scripts/desk.py --help

  engine:
    name: vendored engine tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests
        working-directory: vendor/day-trader-skill-codex

  dashboard:
    name: dashboard build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --prefix vendor/day-trader-skill-codex/dashboard
      - run: npm run build --prefix vendor/day-trader-skill-codex/dashboard
